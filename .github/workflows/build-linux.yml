name: Build Linux App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
  # GitHub'ın ücretsiz Linux sunucusunu kullanıyoruz
    runs-on: ubuntu-latest

    steps:
    - name: Repo Kontrolu
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Bagimliliklari Yukle
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: PyInstaller ile Linux Derle
      run: |
        pyinstaller --clean --noconfirm --onedir --name="Reapsot" main.py

    - name: Klasoru Zip Yap
      run: |
        cd dist
        zip -r Reapsot-Linux.zip Reapsot

    - name: Dosyayi Indirilebilir Yap (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: linux-app-paketi
        path: dist/Reapsot-Linux.zip
