name: Build macOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Repo Kontrolu
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Bagimliliklari Yukle
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: PyInstaller ile macOS .app Derle
      run: |
        pyinstaller --clean --noconfirm --onedir --windowed --name="Reapsot" main.py

    - name: .app Klasorunu Zip Yap
      run: |
        cd dist
        zip -r Reapsot-macOS.zip Reapsot.app

    - name: .app Dosyasini Indirilebilir Yap (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: macos-app-paketi
        path: dist/Reapsot-macOS.zip
